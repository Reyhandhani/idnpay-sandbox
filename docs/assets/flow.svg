<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Your app posts a charge to the simulator, receives a payment instruction, triggers payment, and receives a signed webhook.">
  <rect width="960" height="360" fill="#f4f4f0" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="120" y="28" width="220" height="52" fill="#ffffff" stroke="#111110" stroke-width="2" />
    <text x="230" y="60" text-anchor="middle" font-size="17" font-weight="bold" fill="#111110">Your app</text>

    <rect x="580" y="28" width="260" height="52" fill="#ffffff" stroke="#111110" stroke-width="2" />
    <text x="710" y="60" text-anchor="middle" font-size="17" font-weight="bold" fill="#111110">idnpay-sandbox</text>

    <line x1="230" y1="80" x2="230" y2="332" stroke="#bcb7ab" stroke-width="1" stroke-dasharray="4 5" />
    <line x1="710" y1="80" x2="710" y2="332" stroke="#bcb7ab" stroke-width="1" stroke-dasharray="4 5" />

    <line x1="236" y1="112" x2="694" y2="112" stroke="#14663f" stroke-width="2" marker-end="url(#a)" />
    <text x="465" y="103" text-anchor="middle" font-size="14" fill="#14663f">POST /v1/charge</text>

    <line x1="704" y1="156" x2="246" y2="156" stroke="#14663f" stroke-width="2" marker-end="url(#a)" />
    <text x="475" y="147" text-anchor="middle" font-size="14" fill="#14663f">201 with VA, QR string, or deeplink</text>

    <line x1="236" y1="216" x2="694" y2="216" stroke="#14663f" stroke-width="2" marker-end="url(#a)" />
    <text x="465" y="207" text-anchor="middle" font-size="14" fill="#14663f">POST /v1/simulate/pay</text>
    <text x="465" y="233" text-anchor="middle" font-size="12" fill="#5f5f58">from curl, or from the dashboard</text>

    <line x1="704" y1="276" x2="246" y2="276" stroke="#14663f" stroke-width="2" marker-end="url(#a)" />
    <text x="475" y="267" text-anchor="middle" font-size="14" fill="#14663f">POST callback_url, signed webhook</text>

    <text x="120" y="340" font-size="12" fill="#5f5f58">Both containers share a Docker network. No public URL, no tunnel.</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663f" />
    </marker>
  </defs>
</svg>
