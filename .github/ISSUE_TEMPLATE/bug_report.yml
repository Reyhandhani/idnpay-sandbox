name: Bug report
description: Report behavior that does not match the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, do not use this form. See [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the request, your configuration (without secrets), and the relevant response.
      placeholder: |
        1. Run `docker compose up -d`
        2. POST /v1/charge with ...
        3. Response received ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: idnpay-sandbox version
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Node.js directly
        - Something else (explain)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Only if you run it directly with Node.js.
      placeholder: "22.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove anything sensitive.
      render: text
