name: Laporan bug
description: Laporkan perilaku yang tidak sesuai dengan dokumentasi.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Makasih sudah melapor. Untuk kerentanan keamanan, jangan pakai formulir ini. Lihat [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Deskripsi
      description: Apa yang terjadi, dan apa yang kamu harapkan.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Langkah untuk mereproduksi
      description: Sertakan request, konfigurasi (tanpa kunci rahasia), dan respons yang relevan.
      placeholder: |
        1. Jalankan `docker compose up -d`
        2. Kirim POST /v1/charge dengan body ...
        3. Respons yang diterima ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi idnpay-sandbox
      placeholder: "0.1.0 atau commit SHA"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Cara menjalankan
      options:
        - Docker Compose
        - Node.js langsung
        - Lainnya (jelaskan)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Versi Node.js
      description: Hanya jika berjalan langsung dengan Node.js.
      placeholder: "22.x"
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Potongan log yang relevan. Hapus informasi sensitif.
      render: text
