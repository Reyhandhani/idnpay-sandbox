name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Smoke test the published tag
        run: |
          docker run -d --name simulator -p 9000:9000 \
            -e CLIENT_KEY=ci-client -e SECRET_KEY=ci-secret \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9000/health; then exit 0; fi
            sleep 1
          done
          docker logs simulator
          exit 1
